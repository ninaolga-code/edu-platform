<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EDU – Charakter</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #263238;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #315a8a;
      text-decoration: none;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      color: #315a8a;
      font-size: 36px;
    }

    .subtitle {
      color: #68727d;
    }

    .game {
      display: block;
      background: white;
      color: #263238;
      text-decoration: none;
      padding: 22px;
      margin-bottom: 15px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .game-title {
      font-size: 21px;
      font-weight: bold;
    }

    .game-description {
      margin-top: 7px;
      color: #707980;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="../">
      ← Język angielski
    </a>

    <header>
      <div style="font-size: 50px;">👤</div>
      <h1>Charakter</h1>
      <div class="subtitle">
        Gry i ćwiczenia
      </div>
    </header>

    <div class="game">
      <div class="game-title">🃏 Memory</div>
      <div class="game-description">
        Ćwiczenie będzie dostępne wkrótce.
      </div>
    </div>

    <div class="game">
      <div class="game-title">✏️ Quiz</div>
      <div class="game-description">
        Ćwiczenie będzie dostępne wkrótce.
      </div>
    </div>

  </div>

</body>
</html>
