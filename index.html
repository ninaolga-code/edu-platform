<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU – gry edukacyjne</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #263238;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 50px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
      color: #315a8a;
    }

    .subtitle {
      font-size: 18px;
      color: #68727d;
    }

    .tree {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .folder {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 8px;
      font-size: 19px;
      font-weight: bold;
      border-radius: 10px;
    }

    .folder:hover {
      background: #f0f4f8;
    }

    .folder a {
      color: #263238;
      text-decoration: none;
    }

    .children {
      margin-left: 28px;
      padding-left: 12px;
      border-left: 2px solid #e1e7ec;
    }

    .empty {
      color: #8b949e;
      padding: 15px;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #9aa1a7;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎓</div>
    <h1>EDU</h1>
    <div class="subtitle">Gry i ćwiczenia edukacyjne</div>
  </header>

  <div id="tree" class="tree">
    <div class="empty">Ładowanie…</div>
  </div>

  <footer>
    EDU · gry edu
  </footer>

</div>

    const response = await fetch("/tree.json");
    const data = await response.json();

    const tree = document.getElementById("tree");
    tree.innerHTML = "";

    renderFolders(data, tree);
  }
