<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU – gry edukacyjne</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #263238;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 50px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
      color: #315a8a;
    }

    .subtitle {
      font-size: 18px;
      color: #68727d;
    }

    .tree {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .item {
      margin: 5px 0;
    }

    .folder {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
    }

    .folder:hover {
      background: #f0f4f8;
    }

    .children {
      margin-left: 28px;
      padding-left: 12px;
      border-left: 2px solid #e1e7ec;
    }

    .link {
      display: block;
      padding: 8px;
      color: #315a8a;
      text-decoration: none;
      font-size: 17px;
      border-radius: 8px;
    }

    .link:hover {
      background: #f0f4f8;
    }

    .empty {
      color: #8b949e;
      padding: 15px;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #9aa1a7;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">🎓</div>
    <h1>EDU</h1>
    <div class="subtitle">Gry i ćwiczenia edukacyjne</div>
  </header>

  <div id="tree" class="tree">
    <div class="empty">Ładowanie…</div>
  </div>

  <footer>
    EDU · gry edu
  </footer>

</div>

<script>
  async function loadTree() {
    const response = await fetch("tree.json");
    const data = await response.json();

    const tree = document.getElementById("tree");
    tree.innerHTML = "";

    renderItems(data, tree);
  }

  function renderItems(items, container) {
    items.forEach(item => {

      // Pomijamy pliki techniczne
      if (
        item.name === "tree.json" ||
        item.name === "generate-tree.js" ||
        item.name === "README.md"
      ) {
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "item";

      if (item.type === "folder") {

        const folder = document.createElement("div");
        folder.className = "folder";

        const icon = document.createElement("span");
        icon.textContent = "📁";

        const name = document.createElement("span");
        name.textContent = formatName(item.name);

        folder.appendChild(icon);
        folder.appendChild(name);

        const children = document.createElement("div");
        children.className = "children";

        folder.onclick = () => {
          children.hidden = !children.hidden;
          icon.textContent = children.hidden ? "📁" : "📂";
        };

        wrapper.appendChild(folder);
        wrapper.appendChild(children);

        renderItems(item.children || [], children);

      } else if (item.name === "index.html") {

        // index.html otwiera stronę folderu
        const parentPath = item.path.replace(/\/index\.html$/, "");

        if (parentPath) {
          const link = document.createElement("a");
          link.className = "link";
          link.href = parentPath + "/";
          link.textContent = "📄 " + formatName(parentPath.split("/").pop());

          wrapper.appendChild(link);
        }
      }

      container.appendChild(wrapper);
    });
  }

  function formatName(name) {
    const names = {
      angielski: "Język angielski",
      chemia: "Chemia",
      charakter: "Charakter",
      dom: "Dom",
      podroze: "Podróże",
      matematyka: "Matematyka"
    };

    return names[name.toLowerCase()] || name;
  }

  loadTree().catch(() => {
    document.getElementById("tree").innerHTML =
      '<div class="empty">Nie udało się wczytać struktury EDU.</div>';
  });
</script>

</body>
</html>
